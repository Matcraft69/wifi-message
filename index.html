<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WiFi P2P Chat</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --primary: #007AFF; --bg: #f5f5f7; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { width: 90%; max-width: 400px; background: white; padding: 20px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .status-bar { font-size: 0.8rem; color: #666; margin-bottom: 15px; display: flex; align-items: center; gap: 5px; }
        .dot { width: 8px; height: 8px; background: #ff3b30; border-radius: 50%; }
        .dot.online { background: #4cd964; }
        #chat { height: 300px; border: 1px solid #eee; border-radius: 12px; overflow-y: auto; padding: 15px; margin: 10px 0; background: #fafafa; display: flex; flex-direction: column; gap: 8px; }
        .msg { padding: 8px 12px; border-radius: 15px; max-width: 80%; font-size: 0.9rem; }
        .msg.me { align-self: flex-end; background: var(--primary); color: white; }
        .msg.them { align-self: flex-start; background: #e9e9eb; color: black; }
        .inputs { display: flex; flex-direction: column; gap: 10px; }
        input { padding: 12px; border: 1px solid #ddd; border-radius: 10px; outline: none; transition: border 0.2s; }
        input:focus { border-color: var(--primary); }
        button { padding: 12px; background: var(--primary); color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: 600; }
        button:disabled { background: #ccc; }
        .setup-row { display: grid; grid-template-columns: 1fr auto; gap: 5px; }
    </style>
</head>
<body>

<div class="container">
    <div class="status-bar">
        <div id="dot" class="dot"></div>
        <span id="statusText">Déconnecté</span>
    </div>

    <div class="setup-row">
        <input type="text" id="myId" placeholder="Mon ID (4 car.)" maxlength="4">
        <button id="btnInit" onclick="initialiser()">Activer</button>
    </div>

    <div id="chat"></div>

    <div class="inputs">
        <input type="text" id="destId" placeholder="ID du destinataire">
        <input type="text" id="message" placeholder="Message..." onkeypress="if(event.key==='Enter') envoyer()">
        <button id="btnSend" onclick="envoyer()" disabled>Envoyer</button>
    </div>
</div>

<script>
    let peer, conn;

    function initialiser() {
        const id = document.getElementById('myId').value;
        if(id.length < 4) return alert("L'ID doit faire 4 caractères");
        
        peer = new Peer(id);
        
        peer.on('open', (id) => {
            document.getElementById('statusText').innerText = "En ligne : " + id;
            document.getElementById('dot').classList.add('online');
            document.getElementById('btnInit').disabled = true;
            document.getElementById('btnSend').disabled = false;
        });

        // Écoute des connexions entrantes
        peer.on('connection', (incomingConn) => {
            conn = incomingConn;
            setupConn();
        });

        peer.on('error', (err) => alert("Erreur: " + err.type));
    }

    function setupConn() {
        conn.on('open', () => {
            document.getElementById('statusText').innerText = "Connecté à " + conn.peer;
        });
        conn.on('data', (data) => {
            afficher(data, 'them');
        });
    }

    function envoyer() {
        const idCible = document.getElementById('destId').value;
        const msg = document.getElementById('message').value;
        if(!msg) return;

        // Si on n'est pas déjà connecté à cet ID, on initie la connexion
        if (!conn || conn.peer !== idCible) {
            conn = peer.connect(idCible);
            conn.on('open', () => {
                conn.send(msg);
                setupConn();
                afficher(msg, 'me');
            });
        } else {
            conn.send(msg);
            afficher(msg, 'me');
        }
        document.getElementById('message').value = "";
    }

    function afficher(texte, auteur) {
        const chat = document.getElementById('chat');
        const div = document.createElement('div');
        div.className = `msg ${auteur}`;
        div.innerText = texte;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
    }
</script>

</body>
</html>
