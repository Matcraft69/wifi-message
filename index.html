<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WiFi Direct Chat</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --primary: #007AFF; --bg: #f2f2f7; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); display: flex; justify-content: center; padding: 20px; margin: 0; }
        .container { width: 100%; max-width: 400px; background: white; padding: 20px; border-radius: 25px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        
        /* En-tête avec Mon ID */
        .header { text-align: center; margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .my-code { font-size: 1.8rem; font-weight: 800; color: var(--primary); letter-spacing: 3px; margin: 5px 0; }
        
        /* Zone de connexion à l'ami */
        .target-area { display: flex; gap: 8px; margin-bottom: 10px; background: #f9f9f9; padding: 10px; border-radius: 15px; }
        .target-area input { flex: 1; border: 1px solid #ddd; padding: 8px 12px; border-radius: 10px; }
        .btn-connect { background: #4cd964; color: white; border: none; border-radius: 10px; padding: 0 15px; cursor: pointer; font-weight: bold; }

        /* Zone de Chat */
        #chat { height: 300px; overflow-y: auto; padding: 10px; margin-bottom: 15px; display: flex; flex-direction: column; gap: 8px; }
        .msg { padding: 10px 14px; border-radius: 18px; max-width: 75%; font-size: 0.95rem; }
        .msg.me { align-self: flex-end; background: var(--primary); color: white; border-bottom-right-radius: 4px; }
        .msg.them { align-self: flex-start; background: #e9e9eb; color: black; border-bottom-left-radius: 4px; }
        
        /* Zone de saisie message */
        .input-area { display: flex; gap: 8px; }
        #message { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 20px; outline: none; }
        .btn-send { background: var(--primary); color: white; border: none; border-radius: 50%; width: 40px; height: 40px; cursor: pointer; }
        
        .info { font-size: 0.7rem; color: #888; text-transform: uppercase; }
        #status { font-size: 0.75rem; color: #666; text-align: center; margin-top: 5px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="info">Mon Code</div>
        <div id="displayMyId" class="my-code">----</div>
        <div id="status">Initialisation...</div>
    </div>

    <div class="target-area">
        <input type="text" id="destId" placeholder="Code de l'ami (4 car.)" maxlength="4" onkeypress="if(event.key==='Enter') validerConnexion()">
        <button class="btn-connect" onclick="validerConnexion()">OK</button>
    </div>

    <div id="chat"></div>

    <div class="input-area">
        <input type="text" id="message" placeholder="Message..." onkeypress="if(event.key==='Enter') envoyer()">
        <button class="btn-send" onclick="envoyer()">></button>
    </div>
</div>

<script>
    let peer, conn;
    const chatBox = document.getElementById('chat');
    
    // Génération automatique de l'ID
    const monID = Math.floor(1000 + Math.random() * 9000).toString();
    document.getElementById('displayMyId').innerText = monID;

    // Initialisation
    peer = new Peer(monID);

    peer.on('open', () => {
        document.getElementById('status').innerText = "Prêt à recevoir";
        const hash = window.location.hash.substring(1);
        if (hash.length === 4) {
            document.getElementById('destId').value = hash;
            connecterA(hash);
        }
    });

    peer.on('connection', (incoming) => {
        conn = incoming;
        ecouterMessages();
        document.getElementById('status').innerText = "Connecté à " + conn.peer;
    });

    function validerConnexion() {
        const idCible = document.getElementById('destId').value;
        if (idCible.length === 4) {
            connecterA(idCible);
        } else {
            alert("L'identifiant doit comporter 4 chiffres.");
        }
    }

    function connecterA(targetId) {
        document.getElementById('status').innerText = "Tentative de connexion...";
        conn = peer.connect(targetId);
        conn.on('open', () => {
            document.getElementById('status').innerText = "Connecté à " + targetId;
            ecouterMessages();
        });
        conn.on('error', () => {
            document.getElementById('status').innerText = "Erreur de connexion";
        });
    }

    function ecouterMessages() {
        conn.on('data', (data) => {
            afficher(data, 'them');
        });
    }

    function envoyer() {
        const msgInput = document.getElementById('message');
        const texte = msgInput.value;
        
        if (!texte) return;
        if (!conn || !conn.open) {
            alert("Veuillez d'abord vous connecter à un ami avec le bouton OK.");
            return;
        }

        conn.send(texte);
        afficher(texte, 'me');
        msgInput.value = "";
    }

    function afficher(texte, type) {
        const div = document.createElement('div');
        div.className = `msg ${type}`;
        div.innerText = texte;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }
</script>

</body>
</html>
