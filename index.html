<!DOCTYPE html>
<html>
<head>
    <title>Messagerie Wi-Fi P2P</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { font-family: sans-serif; max-width: 400px; margin: 20px auto; }
        #chat { height: 200px; border: 1px solid #ccc; overflow-y: scroll; padding: 10px; margin-bottom: 10px; }
        input { width: 80%; padding: 5px; }
    </style>
</head>
<body>

    <h2>Chat Direct</h2>
    
    <input type="text" id="myId" placeholder="Mon ID (4 car.)" maxlength="4">
    <button onclick="initialiser()">Se connecter</button>
    
    <p id="status">Statut : Déconnecté</p>
    <hr>
    
    <input type="text" id="destId" placeholder="ID du destinataire" maxlength="4">
    <div id="chat"></div>
    <input type="text" id="message" placeholder="Votre message...">
    <button onclick="envoyer()">Envoyer</button>

    <script>
        let peer, conn;

        function initialiser() {
            const id = document.getElementById('myId').value;
            if(id.length !== 4) return alert("L'ID doit faire 4 caractères");
            
            // Initialisation de la connexion P2P
            peer = new Peer(id);
            
            peer.on('open', () => {
                document.getElementById('status').innerText = "Prêt. Mon ID : " + id;
            });

            // Écoute des appels entrants
            peer.on('connection', (c) => {
                conn = c;
                configurerLien();
            });
        }

        function configurerLien() {
            conn.on('data', (data) => {
                afficher("Ami: " + data);
            });
        }

        function envoyer() {
            const idCible = document.getElementById('destId').value;
            const msg = document.getElementById('message').value;

            if (!conn || conn.peer !== idCible) {
                conn = peer.connect(idCible);
                conn.on('open', () => {
                    conn.send(msg);
                    configurerLien();
                });
            } else {
                conn.send(msg);
            }
            afficher("Moi: " + msg);
        }

        function afficher(texte) {
            const chat = document.getElementById('chat');
            chat.innerHTML += `<div>${texte}</div>`;
        }
    </script>
</body>
</html>
