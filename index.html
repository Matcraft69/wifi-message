<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WiFi P2P Direct</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --primary: #007AFF; --bg: #f2f2f7; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); display: flex; justify-content: center; padding: 20px; margin: 0; }
        .container { width: 100%; max-width: 400px; background: white; padding: 20px; border-radius: 25px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .header { text-align: center; margin-bottom: 20px; }
        .my-code { font-size: 2rem; font-weight: 800; color: var(--primary); letter-spacing: 5px; margin: 10px 0; }
        #chat { height: 350px; border-radius: 15px; overflow-y: auto; padding: 15px; margin: 15px 0; background: #f9f9f9; display: flex; flex-direction: column; gap: 10px; border: 1px solid #eee; }
        .msg { padding: 10px 14px; border-radius: 18px; max-width: 75%; font-size: 0.95rem; line-height: 1.4; }
        .msg.me { align-self: flex-end; background: var(--primary); color: white; border-bottom-right-radius: 4px; }
        .msg.them { align-self: flex-start; background: #e9e9eb; color: black; border-bottom-left-radius: 4px; }
        .input-area { display: flex; gap: 8px; }
        input { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 20px; outline: none; }
        button { background: var(--primary); color: white; border: none; border-radius: 50%; width: 40px; height: 40px; cursor: pointer; font-weight: bold; }
        .info { font-size: 0.75rem; color: #888; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="info">MON CODE DE CONNEXION</div>
        <div id="displayMyId" class="my-code">....</div>
        <div id="status" class="info">Initialisation...</div>
    </div>

    <div id="chat"></div>

    <div class="input-area">
        <input type="text" id="message" placeholder="Message..." onkeypress="if(event.key==='Enter') envoyer()">
        <button onclick="envoyer()">></button>
    </div>
</div>

<script>
    let peer, conn;
    const chatBox = document.getElementById('chat');
    
    // 1. Générer un ID aléatoire de 4 chiffres
    const monID = Math.floor(1000 + Math.random() * 9000).toString();
    document.getElementById('displayMyId').innerText = monID;

    // 2. Initialiser PeerJS
    peer = new Peer(monID);

    peer.on('open', (id) => {
        document.getElementById('status').innerText = "En attente de messages...";
        verifierURL();
    });

    // 3. Gérer les appels entrants
    peer.on('connection', (incoming) => {
        conn = incoming;
        ecouterMessages();
        document.getElementById('status').innerText = "Connecté à l'ID " + conn.peer;
    });

    // 4. Vérifier si un ID est présent dans l'URL (ex: index.html#5555)
    function verifierURL() {
        const distantID = window.location.hash.substring(1);
        if (distantID && distantID.length === 4) {
            connecterA(distantID);
        }
    }

    function connecterA(targetId) {
        conn = peer.connect(targetId);
        conn.on('open', () => {
            document.getElementById('status').innerText = "Connecté à " + targetId;
            ecouterMessages();
        });
    }

    function ecouterMessages() {
        conn.on('data', (data) => {
            afficher(data, 'them');
        });
    }

    function envoyer() {
        const msgInput = document.getElementById('message');
        const texte = msgInput.value;
        if (!texte) return;

        // Si on n'est pas connecté, on essaie de demander l'ID cible
        if (!conn) {
            const cible = prompt("Entrez le code à 4 chiffres de votre ami :");
            if (cible) {
                connecterA(cible);
                // On attend un peu que la connexion s'ouvre pour envoyer
                setTimeout(() => { if(conn.open) envoyer(); }, 500);
            }
            return;
        }

        conn.send(texte);
        afficher(texte, 'me');
        msgInput.value = "";
    }

    function afficher(texte, type) {
        const div = document.createElement('div');
        div.className = `msg ${type}`;
        div.innerText = texte;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }
</script>

</body>
</html>
